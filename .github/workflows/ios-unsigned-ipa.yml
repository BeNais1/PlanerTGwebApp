name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - "expense-tracker/ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"
  pull_request:
    paths:
      - "expense-tracker/ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 35

    defaults:
      run:
        working-directory: expense-tracker/ios/Planer

    env:
      SPM_PACKAGES: ${{ github.workspace }}/.spm/PlanerSourcePackages
      DERIVED_DATA: ${{ github.workspace }}/.derivedData/Planer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.SPM_PACKAGES }}
            ~/Library/Caches/org.swift.swiftpm
          key: planer-spm-xcode27-${{ hashFiles('expense-tracker/ios/Planer/project.yml') }}
          restore-keys: |
            planer-spm-xcode27-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Planer.xcodeproj \
            -scheme Planer \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES"

      - name: Inspect project
        run: |
          xcodebuild -list -project Planer.xcodeproj

      - name: Cache Xcode build artifacts
        uses: actions/cache@v6
        with:
          path: ${{ env.DERIVED_DATA }}
          key: planer-derived-xcode27-${{ hashFiles('expense-tracker/ios/Planer/**/*.swift', 'expense-tracker/ios/Planer/**/*.plist', 'expense-tracker/ios/Planer/project.yml') }}
          restore-keys: |
            planer-derived-xcode27-

      - name: Compile app and tests for Simulator
        run: |
          set -euo pipefail

          xcodebuild build-for-testing \
            -project Planer.xcodeproj \
            -scheme Planer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set -euo pipefail

          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

          xcodebuild test-without-building \
            -project Planer.xcodeproj \
            -scheme Planer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        run: |
          set -euo pipefail

          xcodebuild build \
            -project Planer.xcodeproj \
            -scheme Planer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Planer.app"
          EXTENSION_PATH="$APP_PATH/PlugIns/PlanerLiveActivity.appex"
          OUTPUT_DIR="$GITHUB_WORKSPACE/expense-tracker/ios/Planer/build"

          test -d "$APP_PATH"
          test -x "$EXTENSION_PATH/PlanerLiveActivity"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$EXTENSION_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXTENSION_PATH/Info.plist")" = "com.apple.widgetkit-extension"

          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          EXTENSION_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXTENSION_PATH/Info.plist")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          EXTENSION_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXTENSION_PATH/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          EXTENSION_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXTENSION_PATH/Info.plist")"

          test "$EXTENSION_BUNDLE_ID" = "$APP_BUNDLE_ID.liveactivity"
          test "$EXTENSION_VERSION" = "$APP_VERSION"
          test "$EXTENSION_BUILD" = "$APP_BUILD"

          printf 'App: %s %s (%s)\nExtension: %s %s (%s)\n' \
            "$APP_BUNDLE_ID" "$APP_VERSION" "$APP_BUILD" \
            "$EXTENSION_BUNDLE_ID" "$EXTENSION_VERSION" "$EXTENSION_BUILD"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR/Payload"
          ditto "$APP_PATH" "$OUTPUT_DIR/Payload/Planer.app"

          cd "$OUTPUT_DIR"
          /usr/bin/zip -qry Planer-unsigned.ipa Payload
          shasum -a 256 Planer-unsigned.ipa > Planer-unsigned.ipa.sha256
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: Planer-unsigned-ipa-${{ github.run_number }}
          path: |
            expense-tracker/ios/Planer/build/Planer-unsigned.ipa
            expense-tracker/ios/Planer/build/Planer-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
