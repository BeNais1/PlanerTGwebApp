name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "expense-tracker/ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"
  pull_request:
    paths:
      - "expense-tracker/ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 35

    defaults:
      run:
        working-directory: expense-tracker/ios/Planer

    env:
      SPM_PACKAGES: ${{ github.workspace }}/.spm/PlanerSourcePackages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_PACKAGES }}
          key: planer-spm-${{ runner.os }}-${{ hashFiles('expense-tracker/ios/Planer/project.yml') }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Planer.xcodeproj \
            -scheme Planer \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES"

      - name: Inspect project
        run: |
          xcodebuild -list -project Planer.xcodeproj

      - name: Compile app and tests for Simulator
        env:
          DERIVED_DATA: ${{ runner.temp }}/PlanerTestsDerivedData
        run: |
          set -euo pipefail

          xcodebuild build-for-testing \
            -project Planer.xcodeproj \
            -scheme Planer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        env:
          DERIVED_DATA: ${{ runner.temp }}/PlanerTestsDerivedData
        run: |
          set -euo pipefail

          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

          xcodebuild test-without-building \
            -project Planer.xcodeproj \
            -scheme Planer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        env:
          DERIVED_DATA: ${{ runner.temp }}/PlanerDeviceDerivedData
        run: |
          set -euo pipefail

          xcodebuild clean build \
            -project Planer.xcodeproj \
            -scheme Planer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/PlanerDeviceDerivedData
        run: |
          set -euo pipefail

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Planer.app"
          OUTPUT_DIR="$GITHUB_WORKSPACE/expense-tracker/ios/Planer/build"

          test -d "$APP_PATH"
          test -x "$APP_PATH/PlugIns/PlanerLiveActivity.appex/PlanerLiveActivity"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_PATH/PlugIns/PlanerLiveActivity.appex/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/PlugIns/PlanerLiveActivity.appex/Info.plist")" = "planer.liveactivity"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR/Payload"
          ditto "$APP_PATH" "$OUTPUT_DIR/Payload/Planer.app"

          cd "$OUTPUT_DIR"
          /usr/bin/zip -qry Planer-unsigned.ipa Payload
          shasum -a 256 Planer-unsigned.ipa > Planer-unsigned.ipa.sha256
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: Planer-unsigned-ipa-${{ github.run_number }}
          path: |
            expense-tracker/ios/Planer/build/Planer-unsigned.ipa
            expense-tracker/ios/Planer/build/Planer-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
