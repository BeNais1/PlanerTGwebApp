name: Build iOS IPA

on:
  push:
    paths:
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      ios_ref:
        description: 'iOS branch or commit to build'
        required: false
        default: 'claude/stoic-jemison-1acf60'

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-26
    defaults:
      run:
        working-directory: expense-tracker-ios

    env:
      PROJECT_PATH: ExpenseTrackerSwiftUI.xcodeproj
      SCHEME: ExpenseTrackerSwiftUI
      CONFIGURATION: Release
      BUNDLE_ID: planer
      APP_MARKETING_VERSION: 1.1.0
      BUILD_DIR: build
      DERIVED_DATA_PATH: build/DerivedData
      EXPORT_PATH: build/export
      RESULT_BUNDLE_PATH: build/ExpenseTrackerSwiftUI.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ios_ref || 'claude/stoic-jemison-1acf60' }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app without signing
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$BUILD_DIR/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was produced."
            exit 1
          fi
          rm -rf "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH/Payload"
          cp -R "$APP_PATH" "$EXPORT_PATH/Payload/"
          (cd "$EXPORT_PATH" && zip -qry ExpenseTrackerSwiftUI.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTrackerSwiftUI-IPA
          path: expense-tracker-ios/build/export/ExpenseTrackerSwiftUI.ipa
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTrackerSwiftUI-build-diagnostics
          path: |
            expense-tracker-ios/build/*.xcresult
            expense-tracker-ios/build/*.log
          retention-days: 7
          if-no-files-found: ignore
