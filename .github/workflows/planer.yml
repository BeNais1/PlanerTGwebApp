name: Planer IPA
on:
  push:
    branches: [main, codex/planer-native-complete]
    paths: ['Planer/**', '.github/workflows/planer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 55
    defaults:
      run:
        working-directory: Planer
    steps:
      - uses: actions/checkout@v6
      - name: Generate project
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          git rev-parse HEAD > build/source-commit.txt
      - uses: actions/cache@v4
        with:
          path: Planer/build/SourcePackages
          key: planer-spm-${{ runner.os }}-${{ hashFiles('Planer/project.yml') }}
      - name: Test on iPhone Simulator
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for ds in d["devices"].values() for x in ds if "iPhone" in x["name"]))')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Planer.xcodeproj -scheme Planer -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/Tests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
      - name: Capture native screens
        run: |
          set -euo pipefail
          mkdir -p build/screens
          xcrun simctl install "$SIM_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/Planer.app
          for SCREEN in home expense finance analytics settings; do
            xcrun simctl terminate "$SIM_ID" com.boris.planer || true
            xcrun simctl launch "$SIM_ID" com.boris.planer --ui-preview "--$SCREEN"
            sleep 3
            xcrun simctl io "$SIM_ID" screenshot "build/screens/$SCREEN.png"
          done
          xcrun simctl terminate "$SIM_ID" com.boris.planer || true
          xcrun simctl launch "$SIM_ID" com.boris.planer --ui-preview --dark
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot build/screens/home-dark.png
      - name: Build unsigned Planer
        run: |
          set -euo pipefail
          xcodebuild build -project Planer.xcodeproj -scheme Planer -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/Release.xcresult \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/xcodebuild.log
      - name: Verify and package IPA
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/Planer.app
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          test "$APP_ID" = com.boris.planer
          test -x "$APP/Planer"
          for EXT in "$APP"/PlugIns/*.appex; do
            EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$EXT/Info.plist")
            case "$EXT_ID" in "$APP_ID".*) ;; *) echo "::error::Invalid extension ID: $EXT_ID"; exit 1 ;; esac
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$EXT/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
          done
          mkdir -p build/export/Payload
          cp -R "$APP" build/export/Payload/
          (cd build/export && zip -qry Planer.ipa Payload)
      - uses: actions/upload-artifact@v6
        with:
          name: Planer-IPA
          path: |
            Planer/build/export/Planer.ipa
            Planer/build/source-commit.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Planer-validation
          path: |
            Planer/build/*.log
            Planer/build/*.xcresult
            Planer/build/screens
            Planer/build/source-commit.txt
