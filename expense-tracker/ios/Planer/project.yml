name: Planer
options:
  bundleIdPrefix: planer
  developmentLanguage: uk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.16.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0
targets:
  Planer:
    type: application
    platform: iOS
    sources:
      - path: Planer
        excludes:
          - Info.plist
          - GoogleService-Info.plist
      - path: Planer/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: planer
        INFOPLIST_FILE: Planer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS:
          - $(inherited)
          - -ObjC
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - PlanerTests
  PlanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlanerTests
    dependencies:
      - target: Planer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: planer.tests
        GENERATE_INFOPLIST_FILE: YES
