name: Planer
options:
  bundleIdPrefix: com.boris
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Planer:
    type: application
    platform: iOS
    sources:
      - Planer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.planer
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planer
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - PlanerTests
  PlanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlanerTests
    dependencies:
      - target: Planer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.planer.tests
        GENERATE_INFOPLIST_FILE: YES
