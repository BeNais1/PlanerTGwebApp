name: Planer
options:
  bundleIdPrefix: planer
  developmentLanguage: uk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.16.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0
targets:
  Planer:
    type: application
    platform: iOS
    sources:
      - path: Planer
        excludes:
          - Info.plist
          - GoogleService-Info.plist
      - path: Shared
      - path: Planer/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - target: PlanerLiveActivity
        embed: true
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: planer
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Planer/Planer.entitlements
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS:
          - $(inherited)
          - -ObjC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 15
    scheme:
      testTargets:
        - PlanerTests
  PlanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlanerTests
    dependencies:
      - target: Planer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: planer.tests
        GENERATE_INFOPLIST_FILE: YES
  PlanerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PlanerLiveActivity
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: planer.liveactivity
        INFOPLIST_FILE: PlanerLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 15
